name: Project Synapse - GitOps Enterprise CI/CD Pipeline

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_SERVING: ghcr.io/rajuzet/agi-serving
  IMAGE_DAEMON: ghcr.io/rajuzet/agi-daemon
  HELM_OCI_REPO: oci://ghcr.io/rajuzet/charts

jobs:
  # ===========================================================================
  # STAGE 1: Linting, Formatting & Static Typing Gate
  # ===========================================================================
  lint-and-typecheck:
    name: "Stage 1: Lint & Static Typing"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Linting & Type Checking Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pyright pytest types-requests types-PyYAML

      - name: Run Ruff Linter & Formatter Check
        run: |
          ruff check agent/ serving/ daemon/ storage/ self_evolution/ optimization/ benchmarks/
          ruff format --check agent/ serving/ daemon/ storage/ self_evolution/ optimization/ benchmarks/

      - name: Run Pyright Static Analysis
        run: |
          pyright agent/ serving/ daemon/ storage/ self_evolution/ optimization/ benchmarks/

      - name: Run MyPy Type Verification
        run: |
          mypy --ignore-missing-imports --no-strict-optional agent/ serving/ daemon/ storage/

  # ===========================================================================
  # STAGE 2: 132-Test Full Regression & Chaos Resilience Gate
  # ===========================================================================
  test-regression-chaos:
    name: "Stage 2: Chaos & Regression Test Gate"
    needs: lint-and-typecheck
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: synapse_root_password
          MYSQL_DATABASE: agi_memory
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -psynapse_root_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Initialize MySQL Schema
        run: |
          sudo apt-get update && sudo apt-get install -y default-mysql-client
          mysql -h 127.0.0.1 -P 3306 -u root -psynapse_root_password agi_memory < storage/schema.sql

      - name: Execute Full Test Suite (132+ Tests across 16 Modules)
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: synapse_root_password
          MYSQL_DATABASE: agi_memory
          GCS_CREDENTIALS_PATH: ""
          GCS_BUCKET_NAME: "agi-agent-ingestion-data"
        run: |
          pytest tests/ -v --maxfail=1 --durations=10

      - name: Verify Chaos Engineering & Resilience Gates
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: synapse_root_password
          MYSQL_DATABASE: agi_memory
        run: |
          pytest tests/test_chaos_engineering.py tests/test_resilience.py tests/test_helm_and_k8s_manifests.py -v

  # ===========================================================================
  # STAGE 3: Multi-Platform Container Build & Push to GHCR
  # ===========================================================================
  build-and-push-images:
    name: "Stage 3: Multi-Arch Container Image Builds (GHCR)"
    needs: test-regression-chaos
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up QEMU for Multi-Platform Emulation
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Serving Metadata (Semantic Tags)
        id: meta-serving
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_SERVING }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and Push agi-serving Image (amd64 / arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile.serving
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-serving.outputs.tags }}
          labels: ${{ steps.meta-serving.outputs.labels }}
          cache-from: type=gha,scope=serving
          cache-to: type=gha,mode=max,scope=serving

      - name: Extract Daemon Metadata (Semantic Tags)
        id: meta-daemon
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_DAEMON }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr

      - name: Build and Push agi-daemon Image (amd64 / arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/Dockerfile.daemon
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-daemon.outputs.tags }}
          labels: ${{ steps.meta-daemon.outputs.labels }}
          cache-from: type=gha,scope=daemon
          cache-to: type=gha,mode=max,scope=daemon

  # ===========================================================================
  # STAGE 4: Helm Lint, Manifest Rendering & OCI Artifact Release
  # ===========================================================================
  helm-lint-and-dryrun:
    name: "Stage 4: Helm Lint & OCI Artifact Release"
    needs: build-and-push-images
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Helm v3
        uses: azure/setup-helm@v4
        with:
          version: 'v3.14.0'

      - name: Lint Synapse Helm Chart
        run: |
          helm lint deployments/helm/agi-synapse --strict

      - name: Render Full Kubernetes Manifests (Dry-Run)
        run: |
          helm template agi-synapse deployments/helm/agi-synapse \
            --namespace production \
            --values deployments/helm/agi-synapse/values.yaml \
            --set global.environment=production > rendered_manifest.yaml
          cat rendered_manifest.yaml

      - name: Validate Kubernetes Manifests with Kubeconform
        uses: yannh/kubeconform-action@v0.1.6
        with:
          k8s-version: '1.29.0'
          files: 'rendered_manifest.yaml'
          schema-locations: |
            default
            https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

      - name: Package Helm Chart Artifact
        run: |
          mkdir -p .cr-release-packages
          helm package deployments/helm/agi-synapse --destination .cr-release-packages

      - name: Log in to GHCR for Helm OCI Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Publish Helm Chart to GHCR OCI
        if: github.event_name != 'pull_request'
        run: |
          helm push .cr-release-packages/agi-synapse-*.tgz ${{ env.HELM_OCI_REPO }}

      - name: Publish Packaged Chart to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: .cr-release-packages/agi-synapse-*.tgz
          generate_release_notes: true
