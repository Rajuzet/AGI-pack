{{- if and .Values.monitoring .Values.monitoring.serviceMonitor .Values.monitoring.serviceMonitor.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "agi-synapse.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agi-synapse.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "agi-synapse.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ .Values.service.ports.serving.name | default "http-serving" }}
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval | default "10s" }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | default "5s" }}
    - port: {{ .Values.service.ports.daemonMetrics.name | default "metrics-daemon" }}
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval | default "10s" }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout | default "5s" }}
{{- end }}
