{{- if not .Values.mysql.existingSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agi-synapse.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agi-synapse.labels" . | nindent 4 }}
type: Opaque
data:
  mysql-root-password: {{ "synapse_root_secret_pass" | b64enc | quote }}
{{- end }}
